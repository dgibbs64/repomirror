# repomirror configuration file
# Place this file (mirrors.yml) in the same directory as the repomirror binary.
#
# 'output_dir' is the root that your webserver serves.  Each repo's 'path'
# maps directly to the URL path clients will use, e.g.:
#   deb http://example.com/ubuntu noble main
#   baseurl=http://example.com/centos/9-stream/BaseOS/x86_64/os/

output_dir: ./mirror # root served by nginx/apache
mirror_url: http://mirror.example.com # base URL clients use to reach this server
rpm_primary_metadata: auto # global: auto, sqlite, or xml
workers: auto # integer (e.g. 4) or auto
verify_signatures: true # check repo signatures against gpg_key
prune: true # delete files upstream no longer lists
# rate_limit: 10M # total download speed cap in bytes/s (K, M, G suffixes)
# user_agent: repomirror/custom # override the HTTP User-Agent

rpm_repos:
  # CentOS Stream 9 - BaseOS
  # Client .repo: baseurl=http://example.com/centos/9-stream/BaseOS/x86_64/os/
  - name: centos-9stream-baseos
    enable: true
    path: centos/9-stream/BaseOS/x86_64/os
    base_url: https://mirror.stream.centos.org/9-stream/BaseOS/x86_64/os/
    gpg_key: https://www.centos.org/keys/RPM-GPG-KEY-CentOS-Official

  # CentOS Stream 9 - AppStream
  # Client .repo: baseurl=http://example.com/centos/9-stream/AppStream/x86_64/os/
  - name: centos-9stream-appstream
    path: centos/9-stream/AppStream/x86_64/os
    base_url: https://mirror.stream.centos.org/9-stream/AppStream/x86_64/os/
    gpg_key: https://www.centos.org/keys/RPM-GPG-KEY-CentOS-Official

  # Zabbix 7.0 LTS for RHEL/CentOS 9
  # Client .repo: baseurl=http://example.com/zabbix/7.0/rhel/9/x86_64/
  - name: zabbix-70-rhel9
    path: zabbix/7.0/rhel/9/x86_64
    base_url: https://repo.zabbix.com/zabbix/7.0/rhel/9/x86_64/
    gpg_key: https://repo.zabbix.com/RPM-GPG-KEY-ZABBIX-B5333005

  # PostgreSQL 18 for RHEL/CentOS 9
  # Client .repo: baseurl=http://example.com/postgresql/18/redhat/rhel-9-x86_64/
  - name: postgresql-18-rhel9
    path: postgresql/18/redhat/rhel-9-x86_64
    base_url: https://download.postgresql.org/pub/repos/yum/18/redhat/rhel-9-x86_64/
    gpg_key: https://download.postgresql.org/pub/repos/yum/keys/PGDG-RPM-GPG-KEY-RHEL

  # EPEL 9 (Extra Packages for Enterprise Linux)
  # Client .repo: baseurl=http://example.com/epel/9/Everything/x86_64/
  - name: epel-9
    path: epel/9/Everything/x86_64
    base_url: https://dl.fedoraproject.org/pub/epel/9/Everything/x86_64/
    mirrorlist: https://mirrors.fedoraproject.org/mirrorlist?repo=epel-9&arch=x86_64
    preferred_mirror: dl.fedoraproject.org
    gpg_key: https://dl.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-9

deb_repos:
  # Ubuntu 24.04 LTS (Noble)
  # Client sources.list: deb http://example.com/ubuntu noble main restricted universe
  - name: ubuntu-noble
    enable: true
    path: ubuntu
    mirror: http://archive.ubuntu.com/ubuntu
    mirrorlist: http://mirrors.ubuntu.com/mirrors.txt
    preferred_mirror: archive.ubuntu.com
    suites:
      - noble
      - noble-updates
      - noble-security
    components:
      - main
      - restricted
      - universe
    arches:
      - amd64
    gpg_key: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C

  # Zabbix 7.0 LTS for Ubuntu 24.04
  # Client sources.list: deb http://example.com/zabbix/7.0/ubuntu noble main
  - name: zabbix-70-ubuntu-noble
    path: zabbix/7.0/ubuntu
    mirror: https://repo.zabbix.com/zabbix/7.0/ubuntu
    suites:
      - noble
    components:
      - main
    arches:
      - amd64
    gpg_key: https://repo.zabbix.com/zabbix-official-repo.key

  # PostgreSQL (PGDG) for Ubuntu 24.04
  # Client sources.list: deb http://example.com/postgresql/apt noble-pgdg main
  - name: postgresql-ubuntu-noble
    path: postgresql/apt
    mirror: https://apt.postgresql.org/pub/repos/apt
    suites:
      - noble-pgdg
    components:
      - main
    arches:
      - amd64
    gpg_key: https://www.postgresql.org/media/keys/ACCC4CF8.asc
