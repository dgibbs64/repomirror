  # ---------------------------------------------------------------------------
  # Debian 13 (Trixie)
  # Security updates come from a separate mirror URL, so they are a second entry.
  # ---------------------------------------------------------------------------
  - name: debian-13-trixie
    enable: true
    path: debian
