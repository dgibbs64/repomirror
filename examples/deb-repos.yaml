# DEB repository snippets for mirrors.yml
# Copy the entries you need into the deb_repos section of your mirrors.yml.
# Add 'enable: false' under any repo to skip it temporarily during testing.
# Not all third-party APT repos publish official mirrorlist/metalink endpoints.

deb_repos:
  # ---------------------------------------------------------------------------
  # Source failover example (mirror + mirrorlist)
  # Keep mirror as your preferred pinned source, and use mirrorlist as a
  # fallback source. preferred_mirror biases ordering when multiple sources
  # are available. Disabled because it duplicates ubuntu-noble below.
  # Ubuntu does not publish an official metalink endpoint for this archive.
  # ---------------------------------------------------------------------------
  - name: ubuntu-noble-failover-example
    enable: false
    path: ubuntu
    mirror: http://archive.ubuntu.com/ubuntu
    mirrorlist: http://mirrors.ubuntu.com/mirrors.txt
    preferred_mirror: archive.ubuntu.com
    suites: [noble, noble-updates, noble-security]
    components: [main, restricted, universe]
    arches: [amd64]
    gpg_key: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C

  # ---------------------------------------------------------------------------
  # Ubuntu 26.04 LTS (Resolute Raccoon)
  # ---------------------------------------------------------------------------
  - name: ubuntu-resolute
    enable: true
    path: ubuntu
    mirror: http://archive.ubuntu.com/ubuntu
    suites: [resolute, resolute-updates, resolute-security]
    components: [main, restricted, universe]
    arches: [amd64]
    gpg_key: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C

  # ---------------------------------------------------------------------------
