# RPM repository snippets for mirrors.yml
# Copy the entries you need into the rpm_repos section of your mirrors.yml.
# All examples are for x86_64. Adjust the path/base_url for other arches (e.g. aarch64).
# Add 'enable: false' under any repo to skip it temporarily during testing.
# Not all third-party YUM repos publish official mirrorlist/metalink endpoints.

rpm_repos:
  # ---------------------------------------------------------------------------
  # Source failover example (base_url + mirrorlist)
  # Keep base_url as your preferred pinned mirror, and use mirrorlist as a
  # fallback source. preferred_mirror biases ordering when multiple sources
  # are available. Disabled because it duplicates epel-10 below.
  # ---------------------------------------------------------------------------
  - name: epel-10-failover-example
    enable: false
    path: epel/10/Everything/x86_64
    base_url: https://dl.fedoraproject.org/pub/epel/10/Everything/x86_64/
    mirrorlist: https://mirrors.fedoraproject.org/mirrorlist?repo=epel-10&arch=x86_64
    preferred_mirror: dl.fedoraproject.org
    gpg_key: https://dl.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-10

  # ---------------------------------------------------------------------------
  # CentOS Stream 10
